name: ml-platform-study

services:
  postgres:
    image: docker.io/library/postgres:16.14-bookworm@sha256:714b08dd70c05160db032e4321033ac4e5b6328935b2d03ed419c3a898aa8219
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  garage:
    image: docker.io/dxflrs/garage:v2.0.0@sha256:df71920098b2728cda596c4362cd6316345f6791240b2c2aff8aa34668f99b6d
    command: ["/garage", "server"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN is required}
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage-data:/var/lib/garage
      - ./config/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0@sha256:a5cd51cd14b570ec4374a4dad76a8ff92b7a0a6f66904c871cee18703487d23f
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_KEY_ID:?GARAGE_KEY_ID is required}
      AWS_DEFAULT_REGION: ${GARAGE_S3_REGION:-garage}
      AWS_REGION: ${GARAGE_S3_REGION:-garage}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required}
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://${GARAGE_BUCKET:?GARAGE_BUCKET is required}/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://garage:3900
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./config/mlflow/requirements.txt:/opt/mlflow/requirements.txt:ro
      - ./tests/integration/mlflow:/opt/mlflow/tests:ro
    command:
      - sh
      - -ec
      - |
        python -c "import boto3, psycopg2" || python -m pip install --no-cache-dir -r /opt/mlflow/requirements.txt
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}" \
          --default-artifact-root "$${MLFLOW_DEFAULT_ARTIFACT_ROOT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  prometheus:
    image: docker.io/prom/prometheus:v3.13.1@sha256:bd2dcadfb0d1096e2a4c21817ac7af918e2f19ff628e4bf25fd67a924c13dd80
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: docker.io/grafana/grafana:13.1.0@sha256:6ea068891652aa6a65ca9065c26b89de939653803c836426970305c11fd00534
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_METRICS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-grafana-password}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

  baseline-serving:
    image: ${BASELINE_TRAIN_IMAGE:?BASELINE_TRAIN_IMAGE is required}
    depends_on:
      mlflow:
        condition: service_healthy
    network_mode: host
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_KEY_ID:?GARAGE_KEY_ID is required}
      AWS_DEFAULT_REGION: ${GARAGE_S3_REGION:-garage}
      AWS_REGION: ${GARAGE_S3_REGION:-garage}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required}
      BASELINE_MODEL_NAME: ${BASELINE_MODEL_NAME:-housing-sale-baseline}
      BASELINE_MODEL_VERSION: ${BASELINE_MODEL_VERSION:-}
      BASELINE_SERVE_PORT: ${BASELINE_SERVE_PORT:-18080}
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_S3_ENDPOINT_URL: http://127.0.0.1:${GARAGE_S3_PORT:-3900}
      MLFLOW_TRACKING_URI: http://127.0.0.1:${MLFLOW_PORT:-5000}
      PYTHONPATH: /workspace/src:/workspace
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        : "$${BASELINE_MODEL_VERSION:?BASELINE_MODEL_VERSION is required}"
        python -c "import boto3, fastapi, mlflow, sklearn, uvicorn" || python -m pip install --no-cache-dir ${BASELINE_SERVE_PACKAGES:?BASELINE_SERVE_PACKAGES is required}
        exec python -m uvicorn examples.sklearn_baseline.service.app:app --host 127.0.0.1 --port "$${BASELINE_SERVE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('BASELINE_SERVE_PORT', '18080') + '/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  garage-data:

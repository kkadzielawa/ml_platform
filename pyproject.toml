[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-platform-study"
version = "0.1.0"
description = "Study-first open source ML and LLM platform."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = [
  "duckdb>=1.5.5,<1.6",
  "polars>=1.43.2,<1.44",
  "pyarrow>=25.0.1,<26",
]
test = [
  "pytest>=8.0,<9.0",
  "PyYAML>=6.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mlflow-postgres.yaml
  - mlflow.yaml
  - mlflow-proxy.yaml

configMapGenerator:
  - name: mlflow-oidc-registration
    namespace: ml-platform-system
    files:
      - register_mlflow_oidc.py
  - name: mlflow-baseline-recreation
    namespace: ml-platform-data
    files:
      - recreate_baseline.py
      - phase-0-baseline-export.json

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: ml-platform-study
      ml-platform.local/phase: "04"
      ml-platform.local/component: experiment-tracking
      ml-platform.local/cluster-route: kind
    includeSelectors: false

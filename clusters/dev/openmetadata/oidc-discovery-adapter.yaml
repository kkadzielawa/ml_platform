apiVersion: v1
kind: ConfigMap
metadata:
  name: openmetadata-oidc-discovery-adapter
  namespace: ml-platform-data
  labels:
    app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
    app.kubernetes.io/component: metadata-catalog-identity
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:18081;
      proxy_set_header X-Forwarded-Host 127.0.0.1:18081;
      proxy_set_header X-Forwarded-Port 18081;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Accept-Encoding "";

      # OpenMetadata retrieves discovery and exchanges authorization codes from
      # inside the cluster. The browser reaches Keycloak through its local
      # port-forward, so keep front-channel endpoints browser-facing and
      # rewrite only back-channel endpoints to this in-cluster adapter.
      location = /realms/ml-platform-study/.well-known/openid-configuration {
        proxy_pass http://keycloak.ml-platform-system.svc.cluster.local:8080;
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'http://127.0.0.1:18081/realms/ml-platform-study/protocol/openid-connect/token' 'http://openmetadata-oidc-discovery-adapter.ml-platform-data.svc.cluster.local:8080/realms/ml-platform-study/protocol/openid-connect/token';
        sub_filter 'http://127.0.0.1:18081/realms/ml-platform-study/protocol/openid-connect/token/introspect' 'http://openmetadata-oidc-discovery-adapter.ml-platform-data.svc.cluster.local:8080/realms/ml-platform-study/protocol/openid-connect/token/introspect';
        sub_filter 'http://127.0.0.1:18081/realms/ml-platform-study/protocol/openid-connect/userinfo' 'http://openmetadata-oidc-discovery-adapter.ml-platform-data.svc.cluster.local:8080/realms/ml-platform-study/protocol/openid-connect/userinfo';
        sub_filter 'http://127.0.0.1:18081/realms/ml-platform-study/protocol/openid-connect/certs' 'http://openmetadata-oidc-discovery-adapter.ml-platform-data.svc.cluster.local:8080/realms/ml-platform-study/protocol/openid-connect/certs';
        sub_filter 'http://127.0.0.1:18081/realms/ml-platform-study/protocol/openid-connect/revoke' 'http://openmetadata-oidc-discovery-adapter.ml-platform-data.svc.cluster.local:8080/realms/ml-platform-study/protocol/openid-connect/revoke';
      }

      location /realms/ml-platform-study/protocol/openid-connect/ {
        proxy_pass http://keycloak.ml-platform-system.svc.cluster.local:8080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata-oidc-discovery-adapter
  namespace: ml-platform-data
  labels:
    app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
    app.kubernetes.io/component: metadata-catalog-identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
        app.kubernetes.io/component: metadata-catalog-identity
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27.5-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/ml-platform-study/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: openmetadata-oidc-discovery-adapter
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-oidc-discovery-adapter
  namespace: ml-platform-data
  labels:
    app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
    app.kubernetes.io/component: metadata-catalog-identity
spec:
  selector:
    app.kubernetes.io/name: openmetadata-oidc-discovery-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http

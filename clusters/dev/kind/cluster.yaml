# Pinned kind configuration for the Phase 1 disposable study cluster.
#
# Node image pin source:
# https://github.com/kubernetes-sigs/kind/releases
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    labels:
      ml-platform.local/node-pool: control-plane
      ml-platform.local/lifecycle: disposable
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    labels:
      ml-platform.local/node-pool: general
      ml-platform.local/workload-class: platform
      ml-platform.local/lifecycle: disposable
  - role: worker
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    labels:
      ml-platform.local/node-pool: general
      ml-platform.local/workload-class: ml
      ml-platform.local/lifecycle: disposable


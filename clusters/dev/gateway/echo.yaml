apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-echo
  namespace: ml-platform-project-housing
  labels:
    app.kubernetes.io/name: gateway-echo
    app.kubernetes.io/component: gateway-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-echo
        app.kubernetes.io/component: gateway-fixture
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:1c5d47ecd9c4fca235ec0eeb9af0c39d8dd981ae703805a1f23676a9bf47c3bb
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-echo
  namespace: ml-platform-project-housing
  labels:
    app.kubernetes.io/name: gateway-echo
    app.kubernetes.io/component: gateway-fixture
spec:
  selector:
    app.kubernetes.io/name: gateway-echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-echo
  namespace: ml-platform-project-housing
spec:
  parentRefs:
    - name: ml-platform-local
      namespace: ml-platform-system
  hostnames:
    - gateway.ml-platform.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gateway-echo
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /hostname
      backendRefs:
        - name: gateway-echo
          port: 80

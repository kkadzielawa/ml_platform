apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ml-platform-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ml-platform-local-hostport
  namespace: ml-platform-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  nodeSelector:
                    kubernetes.io/hostname: ml-platform-study-dev-control-plane
                  tolerations:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
                      effect: NoSchedule
                  containers:
                    - name: envoy
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          cpu: 500m
                          memory: 512Mi
                      securityContext:
                        capabilities:
                          add:
                            - NET_BIND_SERVICE
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 10m
                          memory: 32Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ml-platform-local
  namespace: ml-platform-system
spec:
  gatewayClassName: ml-platform-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ml-platform-local-hostport
  listeners:
    - name: http
      hostname: gateway.ml-platform.local
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

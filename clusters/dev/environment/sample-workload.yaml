apiVersion: v1
kind: Namespace
metadata:
  name: ml-platform-dev-housing
  labels:
    app.kubernetes.io/name: ml-platform-dev-housing
    ml-platform.local/environment: dev
    ml-platform.local/namespace-class: project
    ml-platform.local/promotion-tier: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: housing-price-api
  namespace: ml-platform-dev-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: housing-price-api
        ml-platform.local/environment: dev
    spec:
      containers:
        - name: api
          image: ghcr.io/kkadzielawa/ml-platform-study/housing-price-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: housing-feature-cache
  namespace: ml-platform-dev-housing
  labels:
    app.kubernetes.io/name: housing-feature-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: housing-api-dev-egress
  namespace: ml-platform-dev-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  policyTypes:
    - Egress
  egress:
    - {}

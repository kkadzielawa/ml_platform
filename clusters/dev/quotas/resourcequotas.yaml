apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-system-quota
  namespace: ml-platform-system
  labels:
    ml-platform.local/namespace-class: platform
    ml-platform.local/owner: platform-team
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: 3Gi
    limits.cpu: "5"
    limits.memory: 8Gi
    pods: "30"
    services: "20"
    configmaps: "50"
    secrets: "80"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-data-quota
  namespace: ml-platform-data
  labels:
    ml-platform.local/namespace-class: platform
    ml-platform.local/owner: platform-team
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "30"
    services: "20"
    configmaps: "50"
    secrets: "50"
---
apiVersion: v1

apiVersion: v1
kind: Namespace
metadata:
  name: ml-platform-stage-housing
  labels:
    app.kubernetes.io/name: ml-platform-stage-housing
    ml-platform.local/environment: stage
    ml-platform.local/namespace-class: project
    ml-platform.local/promotion-tier: preproduction
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: housing-price-api
  namespace: ml-platform-stage-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: housing-price-api
        ml-platform.local/environment: stage
    spec:
      containers:
        - name: api
          image: ghcr.io/kkadzielawa/ml-platform-study/housing-price-api@sha256:2222222222222222222222222222222222222222222222222222222222222222
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: housing-feature-cache
  namespace: ml-platform-stage-housing
  labels:
    app.kubernetes.io/name: housing-feature-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-retained
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: housing-api-stage-egress
  namespace: ml-platform-stage-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443

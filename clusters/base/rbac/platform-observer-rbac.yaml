apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-observer
  namespace: ml-platform-system
  labels:
    app.kubernetes.io/name: platform-observer
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "poolers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-admins-platform-observer
  namespace: ml-platform-system
  labels:
    app.kubernetes.io/name: platform-observer
    app.kubernetes.io/component: rbac
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: platform-admins
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: platform-observer
---

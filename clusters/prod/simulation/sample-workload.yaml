apiVersion: v1
kind: Namespace
metadata:
  name: ml-platform-prod-housing
  labels:
    app.kubernetes.io/name: ml-platform-prod-housing
    ml-platform.local/environment: prod-simulation
    ml-platform.local/namespace-class: project
    ml-platform.local/promotion-tier: production-simulation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: housing-price-api
  namespace: ml-platform-prod-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: housing-price-api
        ml-platform.local/environment: prod-simulation
    spec:
      containers:
        - name: api
          image: ghcr.io/kkadzielawa/ml-platform-study/housing-price-api@sha256:3333333333333333333333333333333333333333333333333333333333333333
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: housing-feature-cache
  namespace: ml-platform-prod-housing
  labels:
    app.kubernetes.io/name: housing-feature-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-retained
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: housing-api-prod-default-deny
  namespace: ml-platform-prod-housing
  labels:
    app.kubernetes.io/name: housing-price-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: housing-price-api
  policyTypes:
    - Ingress
    - Egress
